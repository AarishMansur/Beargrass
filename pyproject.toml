[project]
name = "touch-grass-agent"
version = "1.0.0"
description = "A privacy-first Hermes agent that turns screen-time alerts into nearby outdoor plans via OpenStreetMap."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aarish mansur", email = "aarishmansur@gmail.com" }]
keywords = ["agent", "hermes", "fastapi", "openstreetmap", "screen-time"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
touch-grass = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
